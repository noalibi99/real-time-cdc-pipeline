services:
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-pgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgres}
            POSTGRES_DB: ${POSTGRES_DB:-trading}
        ports:
            - "5432:5432"
        command:
            - "postgres"
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_replication_slots=4"
            - "-c"
            - "max_wal_senders=4"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    pgadmin:
        image: dpage/pgadmin4:8
        container_name: pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
        ports:
            - "5050:80"
        depends_on:
            - postgres
        volumes:
            - pgadmin_data:/var/lib/pgadmin
    zookeeper:
        image: confluentinc/cp-zookeeper:7.6.1
        container_name: zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - "2181:2181"
    kafka:
        image: confluentinc/cp-kafka:7.6.1
        container_name: kafka
        networks:
            default:
            iceberg_net:
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
            - "9092:9092"
        depends_on:
            - zookeeper
    debezium:
        image: debezium/connect:2.0
        container_name: debezium
        environment:
            BOOTSTRAP_SERVERS: kafka:9092
            GROUP_ID: 1
            CONFIG_STORAGE_TOPIC: my_connect_configs
            OFFSET_STORAGE_TOPIC: my_connect_offsets
            STATUS_STORAGE_TOPIC: my_connect_statuses
        ports:
            - "8083:8083"
        depends_on:
            - kafka
    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        ports:
            - "8080:8080"
        depends_on:
            - kafka
    spark-iceberg:
        image: tabulario/spark-iceberg
        container_name: spark-iceberg
        build: spark/
        networks:
            iceberg_net:
        depends_on:
            - rest
            - minio
        volumes:
            - ./warehouse:/home/iceberg/warehouse
            - ./spark/jobs:/home/iceberg/notebooks/notebooks
        environment:
            - AWS_ACCESS_KEY_ID=admin
            - AWS_SECRET_ACCESS_KEY=password
            - AWS_REGION=us-east-1
        ports:
            - "8888:8888"
            - "8084:8080"
            - "4040:4040"
            - "4041:4041"
            - "4042:4042"
            - "4043:4043"
            - "10000:10000"
            - "10001:10001"

    rest:
        image: apache/iceberg-rest-fixture
        container_name: iceberg-rest
        networks:
            iceberg_net:
        ports:
            - "8181:8181"
        environment:
            - AWS_ACCESS_KEY_ID=admin
            - AWS_SECRET_ACCESS_KEY=password
            - AWS_REGION=us-east-1
            - CATALOG_WAREHOUSE=s3://warehouse/
            - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
            - CATALOG_S3_ENDPOINT=http://minio:9000
            - CATALOG_S3_PATH_STYLE_ACCESS=true

    minio:
        image: minio/minio
        container_name: minio
        environment:
            - MINIO_ROOT_USER=admin
            - MINIO_ROOT_PASSWORD=password
            - MINIO_DOMAIN=minio
        networks:
            iceberg_net:
                aliases:
                    - bronze.minio
                    - silver.minio
                    - gold.minio
                    - warehouse.minio
        ports:
            - "9001:9001"
            - "9000:9000"
        command: ["server", "/data", "--console-address", ":9001"]
        volumes:
            - minio_data:/data

    mc:
        image: minio/mc
        container_name: mc
        depends_on:
            - minio
        networks:
            iceberg_net:
        environment:
            - AWS_ACCESS_KEY_ID=admin
            - AWS_SECRET_ACCESS_KEY=password
            - AWS_REGION=us-east-1
        entrypoint: |
            /bin/sh -c "
            # Wait for MinIO to fully start
            until (/usr/bin/mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;

            # 1. Setup Bronze Bucket
            /usr/bin/mc mb --ignore-existing minio/bronze;
            /usr/bin/mc policy set public minio/bronze;

            # 2. Setup Silver Bucket
            /usr/bin/mc mb --ignore-existing minio/silver;
            /usr/bin/mc policy set public minio/silver;

            # 3. Setup Gold Bucket
            /usr/bin/mc mb --ignore-existing minio/gold;
            /usr/bin/mc policy set public minio/gold;

            # 4. Setup Default Warehouse Bucket (Required as a fallback for the REST Catalog root)
            /usr/bin/mc mb --ignore-existing minio/warehouse;
            /usr/bin/mc policy set public minio/warehouse;

            echo 'Medallion buckets successfully provisioned!'
            tail -f /dev/null
            "

    trino:
        image: trinodb/trino:440
        container_name: trino
        networks:
            iceberg_net:
        ports:
            - "8085:8080"
        volumes:
            - ./trino/etc:/etc/trino
        depends_on:
            - rest
            - minio

    superset:
        build: superset/
        container_name: superset
        networks:
            iceberg_net:
        environment:
            - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-change-me-for-local-dev-only}
            - SUPERSET_LOAD_EXAMPLES=no
        ports:
            - "8088:8088"
        volumes:
            - superset_home:/app/superset_home
            - ./superset/superset_config.py:/app/pythonpath/superset_config.py
        depends_on:
            superset-init:
                condition: service_completed_successfully
        command: >
            /bin/sh -c "
            superset run -h 0.0.0.0 -p 8088
            "

    superset-init:
        build: superset/
        container_name: superset-init
        networks:
            iceberg_net:
        environment:
            - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-change-me-for-local-dev-only}
        volumes:
            - superset_home:/app/superset_home
            - ./superset/superset_config.py:/app/pythonpath/superset_config.py
        depends_on:
            - trino
        command: >
            /bin/sh -c "
            superset db upgrade &&
            (superset fab create-admin
            --username admin
            --firstname Superset
            --lastname Admin
            --email admin@example.com
            --password admin || true) &&
            superset init &&
            superset set-database-uri -d Iceberg -u trino://superset@trino:8080/iceberg/gold
            "


volumes:
    postgres_data:
    pgadmin_data:
    minio_data:
    superset_home:

networks:
    iceberg_net:
