services:
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-pgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgres}
            POSTGRES_DB: ${POSTGRES_DB:-trading}
        ports:
            - "5432:5432"
        command:
            - "postgres"
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_replication_slots=4"
            - "-c"
            - "max_wal_senders=4"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    pgadmin:
        image: dpage/pgadmin4:8
        container_name: pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
        ports:
            - "5050:80"
        depends_on:
            - postgres
        volumes:
            - pgadmin_data:/var/lib/pgadmin
    zookeeper:
        image: confluentinc/cp-zookeeper:7.6.1
        container_name: zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - "2181:2181"
    kafka:
        image: confluentinc/cp-kafka:7.6.1
        container_name: kafka
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
            - "9092:9092"
        depends_on:
            - zookeeper
    debezium:
        image: debezium/connect:2.0
        container_name: debezium
        environment:
            BOOTSTRAP_SERVERS: kafka:9092
            GROUP_ID: 1
            CONFIG_STORAGE_TOPIC: my_connect_configs
            OFFSET_STORAGE_TOPIC: my_connect_offsets
            STATUS_STORAGE_TOPIC: my_connect_statuses
        ports:
            - "8083:8083"
        depends_on:
            - kafka
    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        ports:
            - "8080:8080"
        depends_on:
            - kafka
    minio:
        image: minio/minio:latest
        container_name: minio
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        ports:
            - "9000:9000"   # S3 API
            - "9001:9001"   # Web console
        volumes:
            - minio_data:/data
        command: server /data --console-address ":9001"
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 5s
            timeout: 5s
            retries: 5

    # Creates the bronze bucket on first startup
    minio-init:
        image: minio/mc:latest
        container_name: minio-init
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/bronze &&
            echo 'Bucket ready'
            "

    spark-master:
        image: spark:3.5.5
        container_name: spark-master
        environment:
            - SPARK_MODE=master
        command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
        ports:
            - "7077:7077"
            - "8082:8080"   # Spark UI on host 8082
        volumes:
            - spark_data:/opt/spark/data
            - ./spark/jobs:/opt/spark/jobs
            - ./spark/jars:/opt/spark/jarss

    spark-worker:
        image: spark:3.5.5
        container_name: spark-worker
        environment:
            - SPARK_MODE=worker
            - SPARK_MASTER_URL=spark://spark-master:7077
            - SPARK_WORKER_MEMORY=4G
            - SPARK_WORKER_CORES=4
        command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077
        depends_on:
            - spark-master
        volumes:
            - spark_data:/opt/spark/data
            - ./spark/jobs:/opt/spark/jobs
            - ./spark/jars:/opt/spark/jarss
    

volumes:
    postgres_data:
    pgadmin_data:
    spark_data:
    minio_data: